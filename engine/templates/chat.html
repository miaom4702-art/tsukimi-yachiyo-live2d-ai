<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesktopAI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid #1a3a5c;
  flex-shrink: 0;
}
.header-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e94560, #0f3460);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #fff;
  font-weight: bold;
  flex-shrink: 0;
}
.header-info { flex: 1; }
.header-info h1 { font-size: 16px; font-weight: 600; }
.header-info p { font-size: 12px; color: #8899aa; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.btn-icon {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #c0d0e0;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.btn-icon:hover { background: rgba(255,255,255,0.15); color: #fff; }
.btn-icon.active { background: #e94560; border-color: #e94560; color: #fff; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.msg {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }
.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
}
.msg.user .msg-avatar { background: #e94560; color: #fff; }
.msg.ai .msg-avatar { background: #0f3460; color: #e94560; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.msg.user .msg-bubble {
  background: #e94560;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.ai .msg-bubble {
  background: #16213e;
  border: 1px solid #1a3a5c;
  border-bottom-left-radius: 4px;
}
.msg-bubble p { margin: 4px 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble code {
  background: rgba(0,0,0,0.3);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 13px;
}
.msg-bubble pre {
  background: rgba(0,0,0,0.4);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
}
.msg-bubble pre code { background: none; padding: 0; }
.msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 6px 0; }
.msg-bubble strong { font-weight: 600; }
.msg-time { font-size: 11px; color: #667; margin-top: 4px; }
.msg.user .msg-time { text-align: right; }

.typing {
  align-self: flex-start;
  display: flex;
  gap: 10px;
  animation: fadeIn 0.3s ease;
}
.typing .msg-avatar { background: #0f3460; color: #e94560; }
.typing-dots {
  display: flex;
  gap: 4px;
  padding: 14px 18px;
  background: #16213e;
  border: 1px solid #1a3a5c;
  border-radius: 12px;
  border-bottom-left-radius: 4px;
}
.typing-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #e94560;
  animation: typingBounce 1.4s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

.input-area {
  padding: 12px 16px;
  background: #16213e;
  border-top: 1px solid #1a3a5c;
  flex-shrink: 0;
}
.input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-wrap textarea {
  flex: 1;
  background: #0d1b2a;
  border: 1px solid #1a3a5c;
  border-radius: 10px;
  padding: 10px 14px;
  color: #e0e0e0;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
}
.input-wrap textarea:focus { border-color: #e94560; }
.input-wrap textarea::placeholder { color: #556; }
.btn-send {
  background: #e94560;
  border: none;
  border-radius: 10px;
  width: 44px; height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-send:hover { background: #d63851; transform: scale(1.05); }
.btn-send:active { transform: scale(0.95); }
.btn-send svg { width: 20px; height: 20px; fill: #fff; }

.system-msg {
  text-align: center;
  font-size: 12px;
  color: #556;
  padding: 4px 0;
}

.scroll-bottom {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f3460;
  border: 1px solid #1a3a5c;
  color: #c0d0e0;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  display: none;
  transition: all 0.2s;
}
.scroll-bottom:hover { background: #1a3a5c; }

.cmd-hint {
  font-size: 11px;
  color: #556;
  text-align: center;
  padding: 4px 0 0;
}
.cmd-hint kbd {
  background: #0d1b2a;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  border: 1px solid #1a3a5c;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar">AI</div>
  <div class="header-info">
    <h1 id="aiName">DesktopAI</h1>
    <p id="aiStatus">在线</p>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btnJptts" onclick="toggleJptts()">🇯🇵 日语</button>
    <button class="btn-icon" onclick="toggleVoice()">🎤 语音</button>
    <button class="btn-icon" onclick="clearChat()">🗑 清空</button>
  </div>
</div>

<div class="messages" id="messages">
  <div class="system-msg">DesktopAI 已启动，开始聊天吧！</div>
</div>

<button class="scroll-bottom" id="scrollBottom" onclick="scrollToBottom()">↓ 新消息</button>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onInputKeydown(event)" oninput="autoResize(this)"></textarea>
    <button class="btn-send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="cmd-hint">Enter 发送 · Shift+Enter 换行 · /help 查看命令</div>
</div>

<script>
let isWaiting = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById('scrollBottom').style.display = 'none';
}

document.getElementById('messages').addEventListener('scroll', function() {
  const atBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 100;
  document.getElementById('scrollBottom').style.display = atBottom ? 'none' : 'block';
});

function addMessage(role, content, time) {
  const msgs = document.getElementById('messages');
  const typing = document.querySelector('.typing');
  if (typing) typing.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const t = time || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? 'U' : 'AI'}</div>
    <div>
      <div class="msg-bubble">${content}</div>
      <div class="msg-time">${t}</div>
    </div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isWaiting) return;

  input.value = '';
  input.style.height = 'auto';

  addMessage('user', escapeHtml(text));
  showTyping();
  isWaiting = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    document.querySelector('.typing')?.remove();

    if (data.error) {
      addMessage('ai', `<span style="color:#e94560">${escapeHtml(data.error)}</span>`);
    } else {
      addMessage('ai', renderMarkdown(data.reply));
    }
  } catch (e) {
    document.querySelector('.typing')?.remove();
    addMessage('ai', '<span style="color:#e94560">网络连接失败，请确认服务正在运行</span>');
  }
  isWaiting = false;
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function toggleJptts() {
  const btn = document.getElementById('btnJptts');
  try {
    const res = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: '/jptts' })
    });
    const data = await res.json();
    btn.classList.toggle('active', data.jp_tts);
  } catch (e) {
    console.error(e);
  }
}

async function toggleVoice() {
  try {
    await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: '/v' })
    });
  } catch (e) {
    console.error(e);
  }
}

async function clearChat() {
  if (!confirm('确认清空对话历史？')) return;
  try {
    await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: '/clear' })
    });
    document.getElementById('messages').innerHTML = '<div class="system-msg">对话已清空</div>';
  } catch (e) {
    console.error(e);
  }
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const s = await res.json();
    document.getElementById('aiName').textContent = s.ai_name || 'DesktopAI';
    if (s.jp_tts) document.getElementById('btnJptts').classList.add('active');
  } catch (e) {
    console.error(e);
  }
}

loadSettings();
</script>
</body>
</html>
